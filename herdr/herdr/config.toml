onboarding = false
# herdr configuration — stowed to ~/.config/herdr/config.toml
# Full reference: https://herdr.dev/docs/configuration/
# Print the shipped defaults with: herdr --default-config
# Apply edits to a running server with: herdr server reload-config  (or prefix+shift+r)

# ─── Theme ──────────────────────────────────────────────────────────────────────
# Matches the catppuccin theme used in tmux.conf.
# Built-ins: catppuccin, terminal, tokyo-night, dracula, nord, gruvbox,
#            one-dark, solarized, kanagawa, rose-pine, vesper

[theme]
name = "catppuccin"

# Follow the host terminal's light/dark appearance:
# auto_switch = true
# dark_name = "catppuccin"
# light_name = "catppuccin-latte"

# ─── Keys ─────────────────────────────────────────────────────────────────────
# Unified prefix: same key as tmux (ctrl+a). One prefix in muscle memory, and
# the existing ghostty cmd shortcuts (which send ctrl+a + key) drive herdr too.
# tmux itself is left completely untouched. prefix+? lists all bindings live.
# Caveat: don't run tmux nested inside a herdr pane — both would grab ctrl+a.
# Use one or the other per terminal.

[keys]
prefix = "ctrl+a"

# cmd+t sends prefix + ctrl+c (the tmux new-window chord) → new tab.
new_tab = "prefix+ctrl+c"

# cmd+w sends prefix + c (the tmux "kill pane" chord) → close the focused
# pane, not the whole tab. close_tab would nuke every pane in the tab (and
# cascade into closing the space entirely, since each space here is usually
# one tab) — close_pane only cascades that far when it's truly the last pane
# left, so splits survive cmd+w. herdr's native prefix+x is kept as well.
# (prefix+c is freed from new_tab above, which is covered by cmd+t /
# prefix+ctrl+c.)
close_pane = ["prefix+x", "prefix+c"]
close_tab = "prefix+shift+x"

# cmd+b sends prefix + b → toggle (hide/show) the sidebar. This is herdr's
# native sidebar chord; ghostty maps cmd+b onto it.
toggle_sidebar = "prefix+b"

# Native workspace switcher (existing spaces only).
workspace_picker = "prefix+w"

# cmd+p sends prefix + space → Herdr Navigator: sesh-style fuzzy find-or-create
# across workspaces, agents, projects, sessions, and zoxide directories.
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "herdr-navigator.open"
description = "navigator: jump to anything"

# Lazygit popup at the repo root. cmd+j sends prefix + ctrl+j (the tmux lazygit
# chord). type = "popup" opens a session-modal floating terminal (herdr's real
# equivalent of tmux's display-popup) that closes when lazygit exits, instead
# of consuming a spot in the tab layout like type = "pane" would.
[[keys.command]]
key = "prefix+ctrl+j"
type = "popup"
command = "bash -lc 'lazygit -p \"$(git rev-parse --show-toplevel 2>/dev/null || pwd)\"'"
width = "90%"
height = "90%"

# prefix+u → Herdr Pluck: hint-label a visible URL and open it (tmux-fzf-url).
[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "rmarganti.herdr-pluck.open-url"
description = "pluck: open a visible URL"

# prefix+t → Herdr Pluck: hint-label a visible token and copy it (tmux-thumbs).
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "rmarganti.herdr-pluck.pluck"
description = "pluck: copy a visible token"

# cmd+e sends prefix + ctrl+e → open Zed at the repo root (GUI, detached),
# matching the tmux binding. type = "shell" runs in the background.
[[keys.command]]
key = "prefix+ctrl+e"
type = "shell"
command = "bash -lc 'd=\"${HERDR_ACTIVE_PANE_CWD:-$PWD}\"; zed \"$(git -C \"$d\" rev-parse --show-toplevel 2>/dev/null || echo \"$d\")\"'"

# ─── UI ─────────────────────────────────────────────────────────────────────────
# Create new tabs instantly (cmd+t) instead of prompting for a name, matching
# tmux new-window behavior.

[ui]
prompt_new_tab_name = false

# ─── Session ────────────────────────────────────────────────────────────────────
# Restore supported agent panes into their native sessions after a server
# restart (needs official integrations that report session refs — pi/claude
# are installed). Mirrors the persistence habit from tmux-resurrect/continuum.

show_agent_labels_on_pane_borders = true
[session]
resume_agents_on_restore = true

[ui.toast]
delivery = "system"
